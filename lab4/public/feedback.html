</header>
<main class="container">
<h1 class="section-title">Student Feedback</h1>
<div class="form-box">
  <form onsubmit="alert('Thank you for your feedback!'); return false;">
    <label for="name">Your Name</label><input id="name" type="text" placeholder="Enter your name" required>
    <label for="course">Course</label>
    <select id="course"><option>Class 9–10 Foundation</option><option>Class 11–12 Science</option><option>JEE Preparation</option><option>NEET Foundation</option></select>
    <label for="rating">Rating</label>
    <select id="rating"><option>5 - Excellent</option><option>4 - Very Good</option><option>3 - Good</option><option>2 - Needs Improvement</option><option>1 - Poor</option></select>
    <label for="feedback">Your Feedback</label><textarea id="feedback" placeholder="Tell us about your learning experience..." required></textarea>
    <br><button class="btn" type="submit">Send Feedback</button>
  </form>
</div>
</main>
