<main class="container">
<h1 class="section-title">Student Registration</h1>
<div class="form-box">
  <div class="notice">Fill in your details to register for our tuition classes.</div>
  <form onsubmit="alert('Registration submitted successfully!'); return false;">
    <label for="name">Full Name</label><input id="name" type="text" placeholder="Enter your full name" required>
    <label for="email">Email</label><input id="email" type="email" placeholder="Enter your email" required>
    <label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="Enter your phone number" required>
    <label for="class">Class / Course</label>
    <select id="class" required><option value="">Select a course</option><option>Class 9–10</option><option>Class 11–12 Science</option><option>JEE Foundation</option><option>JEE Main & Advanced</option><option>NEET Foundation</option></select>
    <label for="mode">Preferred Mode</label>
    <select id="mode"><option>Offline</option><option>Online</option><option>Hybrid</option></select>
    <label for="message">Message</label><textarea id="message" placeholder="Any specific requirements?"></textarea>
    <br><button class="btn" type="submit">Submit Registration</button>
  </form>
</div>
</main>
